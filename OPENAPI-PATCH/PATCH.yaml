
openapi: 3.0.3

info:
  title: PATCH operations
  version: 1.0.0
  description: Đặc tả API chỉnh sửa task theo ID

servers:
  - url: http://localhost:5001/v1

tags:
  - name: tasks
    description: Quản lý công việc

security:
  - bearerAuth: []

paths:
  /tasks/{taskId}:
    patch:
      tags: [tasks]
      operationId: patchTaskById
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/Title'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/Priority'
        - $ref: '#/components/parameters/DueDate'
        - $ref: '#/components/parameters/AssigneeId'
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/ServerError'

components:
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      description: UUID of the task
      schema:
        type: string
        format: uuid
        example: '11111111-1111-4111-8111-111111111111'

    Title:
      name: title
      in: query
      schema:
        type: string

    Status:
      name: status
      in: query
      schema:
        type: string
        enum: [open, done]
        example: open

    Priority:
      name: priority
      in: query
      schema:
        type: string
        enum: [low, normal, high]
        example: high

    DueDate:
      name: dueDate
      in: query
      schema:
        type: string
        format: date
        nullable: true
        example: '2026-10-12'

    AssigneeId:
      name: assigneeId
      in: query
      schema:
        type: string
        format: uuid
        nullable: true
        example: '22222222-2222-4222-8222-222222222222'

  schemas:
    Task:
      type: object
      required: [id, title, status, priority]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        status:
          type: string
          enum: [open, done]
        priority:
          type: string
          enum: [low, normal, high]
        dueDate:
          type: string
          format: date
          nullable: true
        assigneeId:
          type: string
          format: uuid
          nullable: true

    Error:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          example: Task not found
        status:
          type: integer
          example: 404
        detail:
          type: string
        instance:
          type: string

  responses:
    Unauthorized:
      description: Thiếu hoặc sai Bearer token
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Không tìm thấy task theo ID
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Lỗi máy chủ không mong đợi
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
